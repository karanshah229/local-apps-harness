services:
  # Ingress Nginx Reverse Proxy
  nginx:
    build:
      context: ..
      dockerfile: infra/nginx/Dockerfile
    container_name: workspace-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - stock
      - gold
      - tidy-contacts

  # Shared PostgreSQL database service
  postgres:
    image: postgres:15-alpine
    container_name: workspace-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=changeme-postgres
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stock Manager App (Express API + React static frontend)
  stock:
    build:
      context: ..
      dockerfile: apps/stock-manager-server/Dockerfile
    container_name: stock-app
    restart: unless-stopped
    expose:
      - "5001"
    volumes:
      - stock-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Sip of Gold (Static website)
  gold:
    build:
      context: ..
      dockerfile: apps/sip-of-gold/Dockerfile
    container_name: gold-app
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Tidy Contacts (private client-side VCF cleaner)
  tidy-contacts:
    build:
      context: ..
      dockerfile: apps/tidy-contacts/Dockerfile
    container_name: tidy-contacts-app
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
    driver: local
  stock-data:
    driver: local
  notes-data:
    driver: local
