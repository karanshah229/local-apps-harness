events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Redirect requests without a trailing slash to preserve relative asset loading
        location = /todo {
            return 301 $scheme://$http_host$request_uri/;
        }

        # Proxy to the Node/Express backend container
        location /todo/ {
            proxy_pass http://todo:5005/;
            proxy_http_version 1.1;

            # WebSocket support for Socket.io
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect stock requests without a trailing slash
        location = /stock {
            return 301 $scheme://$http_host$request_uri/;
        }

        # Proxy to the Stock Manager backend container
        location /stock/ {
            proxy_pass http://stock:5001/;
            proxy_http_version 1.1;

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect gold requests without a trailing slash
        location = /gold {
            return 301 $scheme://$http_host$request_uri/;
        }

        # Proxy to the Sip of Gold container
        location /gold/ {
            proxy_pass http://gold:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
