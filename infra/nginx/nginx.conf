# Generated by scripts/generate-nginx.mjs from platform/apps.json.
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        # stock-manager — generated from platform/apps.json
        location = /stock {
            return 301 $scheme://$http_host$request_uri/;
        }

        location /stock/ {
            proxy_pass http://stock:5001/;
            proxy_http_version 1.1;
            client_max_body_size 55m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # sip-of-gold — generated from platform/apps.json
        location = /gold {
            return 301 $scheme://$http_host$request_uri/;
        }

        location /gold/ {
            proxy_pass http://gold:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # tidy-contacts — generated from platform/apps.json
        location = /tidy-contacts {
            return 301 $scheme://$http_host$request_uri/;
        }

        location /tidy-contacts/ {
            proxy_pass http://tidy-contacts:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
